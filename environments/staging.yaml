# Secret environment variables (references to K8s secrets)
envSecrets:
  MONGODB_URI: multiagent-pred-maint
  VOYAGE_API_KEY: multiagent-pred-maint

# Non-sensitive application configuration
env:
  DATABASE_NAME: agentic_predictive_maintenance
  AWS_REGION: us-east-1
  AWS_PROFILE: default
  CHAT_PROVIDER: bedrock
  COMPLETION_MODEL: arn:aws:bedrock:us-east-1:275662791714:application-inference-profile/vcietr88hund
  EMBEDDING_PROVIDER: voyage
  EMBEDDING_MODEL: voyage-4-lite
  EMBEDDING_DIMENSIONS: "1024"
