---
kind: pipeline
type: kubernetes
name: staging

trigger:
  branch:
    - staging
  paths:
    exclude:
      - README.md
      - THIRD-PARTY-NOTICES.md
      - .gitignore
      - .env.example
      - LICENSE

steps:
  - name: publish
    image: plugins/kaniko-ecr
    settings:
      create_repository: true
      registry: 795250896452.dkr.ecr.us-east-1.amazonaws.com
      repo: industrysolutions/multiagent-pred-maint # Change to demo name (short)
      enable_cache: true
      cache_repo: industrysolutions/multiagent-pred-maint
      snapshot_mode: redo
      tags:
        - git-${DRONE_COMMIT_SHA:0:7}
        - latest
      access_key:
        from_secret: ecr_access_key
      secret_key:
        from_secret: ecr_secret_key
    when:
      event:
        - push

  - name: deploy-staging
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: multiagent-predictive-maintenance # Change to demo name (full)
      values:
        - "image.tag=git-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/multiagent-pred-maint" # Change to demo name (short)
        - "env.DEPLOYMENT_ID=staging-${DRONE_COMMIT_SHA:0:7}-${DRONE_BUILD_NUMBER}"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=multiagent-predictive-maintenance.industrysolutions.staging.corp.mongodb.com" # Change to demo name (full)
        - "mesh.enabled=true"
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=1024Mi"
        - "resources.requests.cpu=250m"
        - "resources.requests.memory=512Mi"
      api_server: https://api.staging.corp.mongodb.com
      kubernetes_token:
        from_secret: staging_kubernetes_token
      values_files: ["environments/staging.yaml"]
    when:
      event:
        - push
---
kind: pipeline
type: kubernetes
name: production

trigger:
  branch:
    - main
  paths:
    exclude:
      - README.md
      - THIRD-PARTY-NOTICES.md
      - .gitignore
      - .env.example
      - LICENSE

steps:
  - name: retag-image-for-prod
    image: public.ecr.aws/aws-cli/aws-cli:2.17.0
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: ecr_access_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: ecr_secret_key
      AWS_DEFAULT_REGION: us-east-1
    commands:
      - aws ecr batch-get-image --repository-name industrysolutions/multiagent-pred-maint --image-ids imageTag=latest --query 'images[0].imageManifest' --output text > /tmp/manifest.json
      - grep -q '{' /tmp/manifest.json
      - aws ecr put-image --repository-name industrysolutions/multiagent-pred-maint --image-tag prod-${DRONE_COMMIT_SHA:0:7} --image-manifest file:///tmp/manifest.json || aws ecr describe-images --repository-name industrysolutions/multiagent-pred-maint --image-ids imageTag=prod-${DRONE_COMMIT_SHA:0:7} >/dev/null
    when:
      event:
        - push

  - name: deploy-prod
    image: public.ecr.aws/kanopy/drone-helm:v3
    settings:
      chart: mongodb/web-app
      chart_version: 4.30.0
      add_repos: [mongodb=https://10gen.github.io/helm-charts]
      namespace: industrysolutions
      release: multiagent-predictive-maintenance
      values:
        - "image.tag=prod-${DRONE_COMMIT_SHA:0:7}"
        - "image.repository=795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/multiagent-pred-maint"
        - "env.DEPLOYMENT_ID=production-${DRONE_COMMIT_SHA:0:7}-${DRONE_BUILD_NUMBER}"
        - "ingress.enabled=true"
        - "ingress.hosts[0]=multiagent-predictive-maintenance.industrysolutions.prod.corp.mongodb.com"
        - "mesh.enabled=true"
        - "resources.limits.cpu=500m"
        - "resources.limits.memory=1024Mi"
        - "resources.requests.cpu=250m"
        - "resources.requests.memory=512Mi"
      api_server: https://api.prod.corp.mongodb.com
      kubernetes_token:
        from_secret: prod_kubernetes_token
      values_files: ["environments/production.yaml"]
    when:
      event:
        - push
